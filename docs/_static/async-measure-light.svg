<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1250" width="1200" height="1250" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12">
  <title>VitafitSession.async_measure</title>
  <style>
    :root {
      --bg: #ffffff; --lane: #f3f4f6; --box: #ffffff; --stroke: #6b7280;
      --text: #111827; --muted: #4b5563;
      --decision: #fef3c7; --decision-stroke: #d97706;
      --queue: #dbeafe; --queue-stroke: #2563eb;
      --end: #dcfce7; --end-stroke: #16a34a;
      --error: #fee2e2; --error-stroke: #dc2626;
    }
    .bg { fill: var(--bg); }
    .lane { fill: var(--lane); }
    .box { fill: var(--box); stroke: var(--stroke); stroke-width: 1.2; }
    .decision { fill: var(--decision); stroke: var(--decision-stroke); stroke-width: 1.2; }
    .queue { fill: var(--queue); stroke: var(--queue-stroke); stroke-width: 1.2; }
    .end { fill: var(--end); stroke: var(--end-stroke); stroke-width: 1.2; }
    .error { fill: var(--error); stroke: var(--error-stroke); stroke-width: 1.2; }
    text { fill: var(--text); }
    .muted { fill: var(--muted); }
    .title { font-size: 14px; font-weight: 600; }
    .label { font-size: 11px; fill: var(--muted); }
    .b { font-weight: 600; }
    .code { font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; font-size: 11.5px; }
    .flow { fill: none; stroke: var(--stroke); stroke-width: 1.4; }
    .dash { fill: none; stroke: var(--stroke); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .err-flow { fill: none; stroke: var(--error-stroke); stroke-width: 1.2; stroke-dasharray: 5 4; }
    .head { fill: var(--stroke); }
    .err-head { fill: var(--error-stroke); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="head"/>
    </marker>
    <marker id="err-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="err-head"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="1250"/>

  <!-- Lanes -->
  <rect class="lane" x="20" y="20" width="230" height="1210" rx="10"/>
  <rect class="lane" x="380" y="20" width="420" height="1210" rx="10"/>
  <rect class="lane" x="940" y="20" width="240" height="1210" rx="10"/>
  <text class="title" x="135" y="46" text-anchor="middle">Notification callback</text>
  <text class="label code" x="135" y="62" text-anchor="middle">_on_notify (called by Bleak)</text>
  <text class="title" x="590" y="46" text-anchor="middle">Main loop</text>
  <text class="label code" x="590" y="62" text-anchor="middle">async_measure → _async_take_frames</text>
  <text class="title" x="1060" y="46" text-anchor="middle">Ack sender task</text>
  <text class="label code" x="1060" y="62" text-anchor="middle">_async_send_acks</text>

  <!-- ===== Main loop: start ===== -->
  <rect class="box" x="400" y="80" width="380" height="44" rx="6"/>
  <text x="590" y="98" text-anchor="middle"><tspan class="b">1. Reset the session</tspan></text>
  <text x="590" y="114" text-anchor="middle" class="muted">Empty frame queue; clear stored weight and impedance</text>

  <rect class="box" x="400" y="144" width="380" height="44" rx="6"/>
  <text x="590" y="162" text-anchor="middle"><tspan class="b">2. Subscribe to notifications</tspan> on 0xFFF1</text>
  <text x="590" y="178" text-anchor="middle" class="muted">From now on, Bleak calls _on_notify for each one</text>

  <rect class="box" x="400" y="208" width="380" height="56" rx="6"/>
  <text x="590" y="226" text-anchor="middle"><tspan class="b">3. Send the start commands</tspan>, each awaited</text>
  <text x="590" y="242" text-anchor="middle" class="muted">Mode (00 normal / 01 weight-only), hello,</text>
  <text x="590" y="256" text-anchor="middle" class="muted">unit only if display_unit was given</text>

  <rect class="box" x="400" y="284" width="380" height="44" rx="6"/>
  <text x="590" y="302" text-anchor="middle"><tspan class="b">4. Create the ack queue; start the sender</tspan></text>
  <text x="590" y="318" text-anchor="middle" class="muted">It runs only while the main loop is waiting</text>

  <rect class="box" x="400" y="348" width="380" height="44" rx="6"/>
  <text x="590" y="366" text-anchor="middle"><tspan class="b">5. Deadline = now + weight_timeout</tspan> (30 s)</text>
  <text x="590" y="382" text-anchor="middle" class="muted">Log “Waiting up to … for a stable weight”</text>

  <line class="flow" x1="590" y1="124" x2="590" y2="144" marker-end="url(#arrow)"/>
  <line class="flow" x1="590" y1="188" x2="590" y2="208" marker-end="url(#arrow)"/>
  <line class="flow" x1="590" y1="264" x2="590" y2="284" marker-end="url(#arrow)"/>
  <line class="flow" x1="590" y1="328" x2="590" y2="348" marker-end="url(#arrow)"/>
  <line class="flow" x1="590" y1="392" x2="590" y2="424" marker-end="url(#arrow)"/>
  <text class="label" x="600" y="413">6. Repeat until an impedance is stored</text>

  <!-- ===== Main loop: per frame ===== -->
  <rect class="decision" x="400" y="424" width="380" height="48" rx="6"/>
  <text x="590" y="443" text-anchor="middle"><tspan class="b">6.1 Has the sender stopped?</tspan></text>
  <text x="590" y="460" text-anchor="middle" class="muted">Only if a write failed: raise its BleakError ⚠</text>

  <rect class="box" x="400" y="492" width="380" height="56" rx="6"/>
  <text x="590" y="510" text-anchor="middle"><tspan class="b">6.2 Take the next frame</tspan> before the deadline</text>
  <text x="590" y="526" text-anchor="middle" class="muted">Deadline checked first: a queue with frames in it</text>
  <text x="590" y="540" text-anchor="middle" class="muted">never makes get() wait, so a timeout alone can't fire</text>

  <rect class="decision" x="400" y="568" width="380" height="56" rx="6"/>
  <text x="590" y="586" text-anchor="middle"><tspan class="b">6.3 Is it the frame being waited for?</tspan></text>
  <text x="590" y="602" text-anchor="middle" class="muted">Any impedance frame, whenever it arrives, or a</text>
  <text x="590" y="616" text-anchor="middle" class="muted">stable weight if none is stored yet</text>

  <rect class="box" x="400" y="644" width="380" height="48" rx="6"/>
  <text x="590" y="663" text-anchor="middle"><tspan class="b">6.4 Queue its ack</tspan> if waited for, or ack_every_frame</text>
  <text x="590" y="680" text-anchor="middle" class="muted">Optional: settling/stable, none waiting; sent later</text>

  <rect class="box" x="400" y="712" width="380" height="44" rx="6"/>
  <text x="590" y="730" text-anchor="middle"><tspan class="b">6.5 Run the callbacks</tspan> in registration order</text>
  <text x="590" y="746" text-anchor="middle" class="muted">Every callback whose type matches; an exception ⚠</text>

  <rect class="decision" x="400" y="776" width="380" height="40" rx="6"/>
  <text x="590" y="800" text-anchor="middle"><tspan class="b">Which frame was it?</tspan></text>

  <rect class="box" x="400" y="848" width="185" height="80" rx="6"/>
  <text x="492" y="866" text-anchor="middle"><tspan class="b">6.7 Stable weight</tspan></text>
  <text x="492" y="882" text-anchor="middle" class="muted">Store it; deadline =</text>
  <text x="492" y="896" text-anchor="middle" class="muted">now + impedance_timeout</text>
  <text x="492" y="910" text-anchor="middle" class="muted">(10 s); log “Weight: …”</text>

  <rect class="box" x="595" y="848" width="185" height="80" rx="6"/>
  <text x="687" y="866" text-anchor="middle"><tspan class="b">6.8 Impedance</tspan></text>
  <text x="687" y="882" text-anchor="middle" class="muted">Store it; log “Impedance: …”</text>
  <text x="687" y="896" text-anchor="middle" class="muted">Before a stable weight?</text>
  <text x="687" y="910" text-anchor="middle" class="muted">It still ends the weigh-in</text>

  <line class="flow" x1="590" y1="472" x2="590" y2="492" marker-end="url(#arrow)"/>
  <line class="flow" x1="590" y1="548" x2="590" y2="568" marker-end="url(#arrow)"/>
  <line class="flow" x1="590" y1="624" x2="590" y2="644" marker-end="url(#arrow)"/>
  <line class="flow" x1="590" y1="692" x2="590" y2="712" marker-end="url(#arrow)"/>
  <line class="flow" x1="590" y1="756" x2="590" y2="776" marker-end="url(#arrow)"/>
  <path class="flow" d="M 520 816 L 492 848" marker-end="url(#arrow)"/>
  <path class="flow" d="M 660 816 L 687 848" marker-end="url(#arrow)"/>

  <!-- Loop back: not waited for (6.6), and after the stable weight -->
  <path class="flow" d="M 400 796 L 392 796 L 392 448 L 400 448" marker-end="url(#arrow)"/>
  <path class="flow" d="M 400 888 L 392 888 L 392 796"/>
  <text class="label" x="386" y="788" text-anchor="end">6.6 not waited</text>
  <text class="label" x="386" y="801" text-anchor="end">for: next frame</text>

  <!-- ===== Main loop: finish ===== -->
  <path class="flow" d="M 687 928 L 687 948" marker-end="url(#arrow)"/>

  <rect class="end" x="400" y="948" width="380" height="64" rx="6"/>
  <text x="590" y="966" text-anchor="middle"><tspan class="b">7. Queue None; wait for the sender</tspan></text>
  <text x="590" y="982" text-anchor="middle" class="muted">It sends every ack still queued first, such as the</text>
  <text x="590" y="996" text-anchor="middle" class="muted">impedance ack; a write that fails raises here ⚠</text>

  <rect class="end" x="400" y="1032" width="380" height="64" rx="6"/>
  <text x="590" y="1050" text-anchor="middle"><tspan class="b">8. Build the result</tspan></text>
  <text x="590" y="1066" text-anchor="middle" class="muted">None without a stable weight; otherwise Measurement</text>
  <text x="590" y="1080" text-anchor="middle" class="muted">(weight, display unit, impedance or None)</text>

  <rect class="end" x="400" y="1116" width="380" height="36" rx="6"/>
  <text x="590" y="1138" text-anchor="middle"><tspan class="b">Log “Result: …” and return it</tspan></text>

  <line class="flow" x1="590" y1="1012" x2="590" y2="1032" marker-end="url(#arrow)"/>
  <line class="flow" x1="590" y1="1096" x2="590" y2="1116" marker-end="url(#arrow)"/>

  <!-- Timeout exit: 6.2 → 7 -->
  <path class="flow" d="M 780 520 L 815 520 L 815 980 L 780 980" marker-end="url(#arrow)"/>
  <text class="label" x="822" y="500">deadline</text>
  <text class="label" x="822" y="513">passed</text>
  <text class="label" x="822" y="945">log “No stable</text>
  <text class="label" x="822" y="958">weight…” or “No</text>
  <text class="label" x="822" y="971">impedance…”</text>

  <!-- Error box -->
  <rect class="error" x="400" y="1168" width="380" height="52" rx="6"/>
  <text x="590" y="1186" text-anchor="middle"><tspan class="b">⚠ 9. Anything raises</tspan> (write, callback, Ctrl+C)</text>
  <text x="590" y="1202" text-anchor="middle" class="muted">Cancel the sender and wait for it to stop;</text>
  <text x="590" y="1215" text-anchor="middle" class="muted">queued acks aren't sent; the exception goes to the caller</text>

  <!-- ===== Notification callback lane ===== -->
  <path class="dash" d="M 400 166 L 252 166" marker-end="url(#arrow)"/>
  <text class="label" x="262" y="158">starts</text>

  <rect class="box" x="30" y="144" width="210" height="44" rx="22"/>
  <text x="135" y="162" text-anchor="middle"><tspan class="b">Scale sends a notification</tspan></text>
  <text x="135" y="178" text-anchor="middle" class="muted">Weight about every 0.36 s</text>

  <rect class="box" x="30" y="208" width="210" height="44" rx="6"/>
  <text x="135" y="226" text-anchor="middle"><tspan class="b">Decode it</tspan></text>
  <text x="135" y="242" text-anchor="middle" class="muted">Log “Received …”</text>

  <rect class="box" x="30" y="272" width="210" height="58" rx="6"/>
  <text x="135" y="290" text-anchor="middle"><tspan class="b">on_receive(raw bytes)</tspan></text>
  <text x="135" y="306" text-anchor="middle" class="muted">Every notification, even after</text>
  <text x="135" y="320" text-anchor="middle" class="muted">async_measure returns</text>

  <rect class="decision" x="30" y="350" width="210" height="44" rx="6"/>
  <text x="135" y="368" text-anchor="middle"><tspan class="b">Weight or impedance</tspan></text>
  <text x="135" y="384" text-anchor="middle"><tspan class="b">frame?</tspan></text>

  <rect class="box" x="30" y="420" width="210" height="58" rx="6"/>
  <text x="135" y="438" text-anchor="middle"><tspan class="b">No: dropped</tspan></text>
  <text x="135" y="454" text-anchor="middle" class="muted">Command replies and bad frames:</text>
  <text x="135" y="468" text-anchor="middle" class="muted">never acked or dispatched</text>

  <line class="flow" x1="135" y1="188" x2="135" y2="208" marker-end="url(#arrow)"/>
  <line class="flow" x1="135" y1="252" x2="135" y2="272" marker-end="url(#arrow)"/>
  <line class="flow" x1="135" y1="330" x2="135" y2="350" marker-end="url(#arrow)"/>
  <line class="flow" x1="135" y1="394" x2="135" y2="420" marker-end="url(#arrow)"/>

  <!-- Frame queue -->
  <path class="queue" d="M 270 494 A 40 9 0 0 1 350 494 L 350 548 A 40 9 0 0 1 270 548 Z"/>
  <path class="queue" d="M 270 494 A 40 9 0 0 0 350 494"/>
  <text x="310" y="520" text-anchor="middle" class="b">Frame</text>
  <text x="310" y="535" text-anchor="middle" class="b">queue</text>
  <text class="label" x="310" y="574" text-anchor="middle">decoded frames</text>
  <path class="flow" d="M 240 372 L 310 372 L 310 485" marker-end="url(#arrow)"/>
  <text class="label" x="254" y="364">yes</text>
  <path class="flow" d="M 350 520 L 400 520" marker-end="url(#arrow)"/>

  <!-- ===== Ack sender lane ===== -->
  <path class="dash" d="M 780 306 L 938 306" marker-end="url(#arrow)"/>
  <text class="label" x="874" y="298">starts</text>

  <!-- Ack queue -->
  <path class="queue" d="M 835 642 A 40 9 0 0 1 915 642 L 915 696 A 40 9 0 0 1 835 696 Z"/>
  <path class="queue" d="M 835 642 A 40 9 0 0 0 915 642"/>
  <text x="875" y="668" text-anchor="middle" class="b">Ack</text>
  <text x="875" y="683" text-anchor="middle" class="b">queue</text>
  <path class="flow" d="M 780 668 L 835 668" marker-end="url(#arrow)"/>
  <path class="flow" d="M 915 668 L 950 668" marker-end="url(#arrow)"/>

  <rect class="box" x="950" y="284" width="220" height="44" rx="22"/>
  <text x="1060" y="302" text-anchor="middle"><tspan class="b">Sender started</tspan></text>
  <text x="1060" y="318" text-anchor="middle" class="muted">Waits for the first ack</text>

  <rect class="box" x="950" y="646" width="220" height="44" rx="6"/>
  <text x="1060" y="664" text-anchor="middle"><tspan class="b">Take the next ack</tspan></text>
  <text x="1060" y="680" text-anchor="middle" class="muted">In the order they were queued</text>

  <rect class="decision" x="950" y="710" width="220" height="44" rx="6"/>
  <text x="1060" y="728" text-anchor="middle"><tspan class="b">Is it None?</tspan></text>
  <text x="1060" y="744" text-anchor="middle" class="muted">Yes: the task ends (step 7)</text>

  <rect class="box" x="950" y="774" width="220" height="58" rx="6"/>
  <text x="1060" y="792" text-anchor="middle"><tspan class="b">Write it to 0xFFF2</tspan></text>
  <text x="1060" y="808" text-anchor="middle" class="muted">on_send; log “Sending …”;</text>
  <text x="1060" y="822" text-anchor="middle" class="muted">await the scale's response</text>

  <line class="flow" x1="1060" y1="328" x2="1060" y2="646" marker-end="url(#arrow)"/>
  <line class="flow" x1="1060" y1="690" x2="1060" y2="710" marker-end="url(#arrow)"/>
  <line class="flow" x1="1060" y1="754" x2="1060" y2="774" marker-end="url(#arrow)"/>
  <text class="label" x="1066" y="768">no</text>
  <path class="flow" d="M 1170 803 L 1176 803 L 1176 668 L 1170 668" marker-end="url(#arrow)"/>

  <rect class="error" x="950" y="852" width="220" height="72" rx="6"/>
  <text x="1060" y="870" text-anchor="middle"><tspan class="b">⚠ A write fails</tspan></text>
  <text x="1060" y="886" text-anchor="middle" class="muted">The task stops with its BleakError.</text>
  <text x="1060" y="900" text-anchor="middle" class="muted">The loop raises it before taking</text>
  <text x="1060" y="914" text-anchor="middle" class="muted">another frame (6.1), or step 7 does</text>
  <line class="err-flow" x1="1060" y1="832" x2="1060" y2="852" marker-end="url(#err-arrow)"/>

  <!-- Legend -->
  <rect class="box" x="30" y="1080" width="210" height="140" rx="6"/>
  <text class="b" x="44" y="1100">Key</text>
  <rect class="box" x="44" y="1110" width="18" height="12" rx="2"/>
  <text x="70" y="1120">Step</text>
  <rect class="decision" x="44" y="1130" width="18" height="12" rx="2"/>
  <text x="70" y="1140">Decision</text>
  <rect class="queue" x="44" y="1150" width="18" height="12" rx="2"/>
  <text x="70" y="1160">Queue between tasks</text>
  <rect class="end" x="44" y="1170" width="18" height="12" rx="2"/>
  <text x="70" y="1180">Finish</text>
  <rect class="error" x="44" y="1190" width="18" height="12" rx="2"/>
  <text x="70" y="1200">Error path (⚠)</text>
  <line class="dash" x1="140" y1="1116" x2="170" y2="1116"/>
  <text x="176" y="1120">starts</text>
</svg>
